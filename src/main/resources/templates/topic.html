<!DOCTYPE html>
<html>
<head>
    <title>Select Topic</title>
    <link rel="stylesheet" href="/css/topic.css">
</head>

<body>

<div class="header">
    <h2>🎯 Select Debate Topic</h2>
    <a href="/dashboard" class="back-btn">← Back</a>
</div>

<div class="container">

    <h1 class="title">
        Choose a Topic
    </h1>

    <div class="topic-container">

        <div class="topic-card" onclick="selectTopic(this)">
            Social media is harmful
        </div>

        <div class="topic-card" onclick="selectTopic(this)">
            Online education vs offline
        </div>

        <div class="topic-card" onclick="selectTopic(this)">
            AI will replace jobs
        </div>

        <div class="topic-card" onclick="selectTopic(this)">
            Technology improves life
        </div>

        <div class="topic-card" onclick="selectTopic(this)">
            Gaming is beneficial
        </div>

        <div class="topic-card" onclick="selectTopic(this)">
            Climate change is real
        </div>

    </div>

    <br>

    <h3>Select Your Side</h3>

    <div style="display:flex;justify-content:center;gap:30px;">

        <label>

            <input type="radio"
                   name="side"
                   value="for"
                   checked>

            In Favor

        </label>

        <label>

            <input type="radio"
                   name="side"
                   value="against">

            Against

        </label>

    </div>

    <br>

    <input
        type="text"
        id="customTopic"
        placeholder="Or enter your own topic..."
    >

    <br><br>

    <button
        class="start-btn"
        onclick="startDebate()">

        Start Debate 🚀

    </button>

</div>

<script>

let selectedTopic="";

function selectTopic(element){

    document
    .querySelectorAll(
        ".topic-card"
    )
    .forEach(card=>{

        card.classList.remove(
            "active"
        );
    });

    element.classList.add(
        "active"
    );

    selectedTopic=
        element.innerText;
}

function startDebate(){

    let custom =
        document.getElementById(
            "customTopic"
        ).value;

    if(custom.trim()!=""){

        selectedTopic=
            custom;
    }

    if(selectedTopic==""){

        alert(
            "Select topic"
        );

        return;
    }

    let side =

        document.querySelector(

            'input[name="side"]:checked'

        ).value;

    window.location.href=

    `/debate?topic=${
        encodeURIComponent(
            selectedTopic
        )
    }&mode=ai&side=${side}`;

}

</script>

</body>
</html>
