<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Sign Up</title>

<link rel="stylesheet" href="/css/styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="box">
<div class="signup">
<div class="signupBx">

<h2>
<i class="fa-solid fa-user-plus"></i>
SIGN UP
</h2>

<form id="signupForm">

<input type="text"
id="fullName"
placeholder="Full Name"
required>

<input type="email"
id="email"
placeholder="Email Address"
required>

<input type="text"
id="username"
placeholder="Username"
required>

<input type="password"
id="password"
placeholder="Password"
required>

<input type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<select id="securityQ" required>

<option value="">
Select Security Question
</option>

<option value="anime">
Your School Name
</option>

<option value="superhero">
Your Favorite Superhero
</option>

<option value="cricketer">
Your Favorite Cricketer
</option>

<option value="lucky">
Your Lucky Number
</option>

<option value="nickname">
Your Childhood Nickname
</option>

</select>

<input type="text"
id="answer"
placeholder="Your Answer"
required>

<input type="submit"
value="Create Account">

</form>

<div class="group">

<a href="/login">
Already have account?
</a>

<a href="/login">
Login
</a>

</div>

</div>
</div>
</div>

<script src="/js/signup.js"></script>

</body>
</html>
