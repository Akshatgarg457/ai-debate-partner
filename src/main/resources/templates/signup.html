<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet"
          href="/css/styles.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="box">

    <div class="signup">

        <div class="signupBx">

            <h2>
                <i class="fa-solid fa-user-plus"></i>
                SIGN UP
            </h2>

            <form id="signupForm">

                <!-- FULL NAME -->

                <input type="text"
                       id="fullName"
                       placeholder="Full Name"
                       required>

                <!-- EMAIL -->

                <input type="email"
                       id="email"
                       placeholder="Email Address"
                       required>

                <!-- USERNAME -->

                <input type="text"
                       id="username"
                       placeholder="Username"
                       required>

                <!-- PASSWORD -->

                <input type="password"
                       id="password"
                       placeholder="Password"
                       required>

                <!-- CONFIRM PASSWORD -->

                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm Password"
                       required>

                <!-- SECURITY QUESTION -->

                <select id="securityQ" required>

                    <option value="">
                        Select Security Question
                    </option>

                    <option value="What is your school name?">
                        What is your school name?
                    </option>

                    <option value="Who is your favorite superhero?">
                        Who is your favorite superhero?
                    </option>

                    <option value="Who is your favorite cricketer?">
                        Who is your favorite cricketer?
                    </option>

                    <option value="What is your lucky number?">
                        What is your lucky number?
                    </option>

                    <option value="What is your childhood nickname?">
                        What is your childhood nickname?
                    </option>

                </select>

                <!-- ANSWER -->

                <input type="text"
                       id="answer"
                       placeholder="Your Answer"
                       required>

                <!-- SUBMIT -->

                <input type="submit"
                       value="Create Account">

            </form>

            <div class="group">

                <a href="/login">
                    Already have account?
                </a>

                <a href="/login">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>

<script src="/js/signup.js"></script>

</body>
</html>
