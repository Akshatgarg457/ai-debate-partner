<!DOCTYPE html>
<html>
<head>

    <title>Debate</title>

    <link rel="stylesheet"
          href="/css/Debate.css">

</head>

<body>

<div class="header">

    <h2 id="modeTitle">
        Debate Mode
    </h2>

    <a href="/dashboard"
       class="back-btn">

        ← Back

    </a>

</div>

<div class="container">

    <h1>
        Start Your Debate
    </h1>

    <h2 id="topicTitle">
        Topic: Loading...
    </h2>

    <h3 id="sideTitle"></h3>

    <div id="chatBox"
         class="chat-box">
    </div>

    <div class="input-section">

        <textarea id="argument"
                  placeholder="Type or speak your argument...">
        </textarea>

        <div class="button-group">

            <button onclick="sendArgument()"
                    id="sendBtn">

                Send
            </button>

            <button onclick="startVoiceInput()"
                    id="voiceBtn">

                🎤 Speak
            </button>

            <button onclick="endDebate()"
                    class="end-btn">

                End Debate
            </button>

        </div>

    </div>

</div>

<div id="resultBox"
     class="result-bottom">
</div>

<script>

// ======================
// URL PARAMS
// ======================

const params =
new URLSearchParams(
window.location.search
);

let topic =
params.get("topic")
|| "General Debate";

let mode =
params.get("mode")
|| "ai";

let side =
params.get("side")
|| "for";

let username =
localStorage.getItem(
"username"
)
|| "guest";

let lastUserArg="";
let lastAiArg="";
let isLoading=false;


// ======================
// UI
// ======================

document.getElementById(
"topicTitle"
).innerText=

"Topic: "
+topic;

document.getElementById(
"modeTitle"
).innerText=

mode==="human"

?

"Human Debate 👥"

:

"AI Debate 🤖";


document.getElementById(
"sideTitle"
).innerHTML=

side==="for"

?

"🟢 Your Side: In Favor"

:

"🔴 Your Side: Against";


// ======================
// CHAT
// ======================

function appendMsg(
type,
text
){

let chat=

document.getElementById(
"chatBox"
);

chat.innerHTML+=

`<div class="msg ${type}">
${text}
</div>`;

chat.scrollTop=
chat.scrollHeight;
}


// ======================
// SPEAK OUTPUT
// ======================

function speakText(
text
){

window
.speechSynthesis
.cancel();

const speech=

new SpeechSynthesisUtterance(
text
);

speech.lang=
"en-US";

window
.speechSynthesis
.speak(
speech
);
}


// ======================
// LONG VOICE INPUT
// ======================

let recognition;

function startVoiceInput(){

const SpeechRecognition=

window.SpeechRecognition
||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"Voice not supported"
);

return;
}

recognition=

new SpeechRecognition();

recognition.continuous=true;

recognition.interimResults=true;

recognition.lang=
"en-US";

let finalText="";

const voiceBtn=

document.getElementById(
"voiceBtn"
);

voiceBtn.innerText=
"🎙 Listening...";

recognition.start();

recognition.onresult=
function(event){

let interim="";

for(

let i=
event.resultIndex;

i<
event.results.length;

i++
){

let transcript=

event.results[i][0]
.transcript;

if(
event.results[i]
.isFinal
){

finalText+=
transcript
+" ";
}

else{

interim+=
transcript;
}

}

document.getElementById(
"argument"
).value=

finalText
+
interim;
};

voiceBtn.onclick=
function(){

recognition.stop();

voiceBtn.innerText=
"🎤 Speak";
};

recognition.onend=
function(){

voiceBtn.innerText=
"🎤 Speak";
};
}


// ======================
// SEND
// ======================

function sendArgument(){

if(isLoading)
return;

let input=

document.getElementById(
"argument"
);

let text=
input.value.trim();

if(text==="")
return;

lastUserArg=
text;

appendMsg(

"user",

`<b>You:</b><br>${text}`
);

input.value="";

isLoading=true;

let typingId=

"typing"

+
Date.now();

appendMsg(

"ai",

`<span id="${typingId}">
<b>AI:</b>
typing...
</span>`
);

fetch(

"/api/debate/reply",

{

method:"POST",

headers:{

"Content-Type":
"application/json"
},

body:
JSON.stringify({

topic:
topic,

argument:
text,

side:
side
})
}
)

.then(
res=>res.text()
)

.then(
data=>{

lastAiArg=
data;

document
.getElementById(
typingId
)

.innerHTML=

`<b>AI:</b><br>
${data}`;

speakText(
data
);
}
)

.catch(()=>{

document
.getElementById(
typingId
)

.innerHTML=

"AI Error";
})

.finally(()=>{

isLoading=
false;
});
}


// ======================
// END
// ======================

function endDebate(){

if(
!lastUserArg
||
!lastAiArg
){

alert(
"Complete one round first"
);

return;
}

fetch(

"/api/debate/analyze",

{

method:"POST",

headers:{

"Content-Type":
"application/json"
},

body:
JSON.stringify({

topic:
topic,

userArg:
lastUserArg,

aiArg:
lastAiArg,

username:
username
})
}
)

.then(
res=>res.json()
)

.then(
data=>{

document
.getElementById(
"resultBox"
)

.innerHTML=

`<div class="result-card">

<h2>
🏆 Debate Result
</h2>

<p>

${data.result}

</p>

</div>`;
});
}

</script>

</body>
</html>
