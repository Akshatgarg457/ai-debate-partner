<!DOCTYPE html>
<html>
<head>

    <title>Debate</title>

    <link rel="stylesheet" href="/css/Debate.css">

</head>

<body>

<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<div class="header">

    <h2 id="modeTitle">
        Debate Mode
    </h2>

    <a href="/dashboard"
       class="back-btn">

        ← Back

    </a>

</div>

<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->

<div class="container">

    <h1>
        Start Your Debate
    </h1>

    <h2 id="topicTitle">
        Topic: Loading...
    </h2>

    <!-- CHAT -->

    <div id="chatBox"
         class="chat-box">
    </div>

    <!-- INPUT -->

    <div class="input-section">

        <textarea id="argument"
                  placeholder="Type or speak your argument...">
        </textarea>

        <br>

        <!-- SEND -->

        <button onclick="sendArgument()"
                id="sendBtn">

            Send

        </button>

        <!-- VOICE -->

        <button onclick="startVoiceInput()"
                id="voiceBtn">

            🎤 Speak

        </button>

        <!-- END -->

        <button onclick="endDebate()"
                class="end-btn">

            End Debate

        </button>

    </div>

</div>

<!-- ========================= -->
<!-- RESULT -->
<!-- ========================= -->

<div id="resultBox"
     class="result-bottom">
</div>

<script>

// =========================
// INIT
// =========================

const params =
    new URLSearchParams(
        window.location.search
    );

let topic =
    params.get("topic")
    || "General Debate";

let mode =
    params.get("mode")
    || "ai";

// USERNAME

let username =
    localStorage.getItem("username")
    || "guest";

// LAST ARGS

let lastUserArg = "";
let lastAiArg = "";

let isLoading = false;

// =========================
// SET UI
// =========================

document.getElementById(
    "topicTitle"
).innerText =
    "Topic: " + topic;

document.getElementById(
    "modeTitle"
).innerText =

    mode === "human"

    ? "Human Debate 👥"

    : "AI Debate 🤖";

// =========================
// APPEND MESSAGE
// =========================

function appendMsg(type, text){

    const chat =
        document.getElementById(
            "chatBox"
        );

    chat.innerHTML += `

        <div class="msg ${type}">

            ${text}

        </div>
    `;

    // AUTO SCROLL

    chat.scrollTop =
        chat.scrollHeight;
}

// =========================
// AI VOICE OUTPUT
// =========================

function speakText(text){

    // STOP OLD SPEECH

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            text
        );

    speech.lang = "en-US";

    speech.rate = 1;

    speech.pitch = 1;

    window.speechSynthesis
        .speak(speech);
}

// =========================
// VOICE INPUT
// =========================

function startVoiceInput(){

    // SUPPORT CHECK

    const SpeechRecognition =

        window.SpeechRecognition
        || window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice recognition not supported in this browser."
        );

        return;
    }

    // CREATE INSTANCE

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;

    // BUTTON

    const voiceBtn =
        document.getElementById(
            "voiceBtn"
        );

    voiceBtn.innerText =
        "🎙 Listening...";

    // START

    recognition.start();

    // RESULT

    recognition.onresult =
        function(event){

        const transcript =

            event.results[0][0]
                .transcript;

        // PUT TEXT

        document.getElementById(
            "argument"
        ).value = transcript;

        // RESET BUTTON

        voiceBtn.innerText =
            "🎤 Speak";

        // AUTO SEND

        sendArgument();
    };

    // ERROR

    recognition.onerror =
        function(event){

        console.log(
            "Voice Error:",
            event.error
        );

        voiceBtn.innerText =
            "🎤 Speak";

        alert(
            "Voice input error: "
            + event.error
        );
    };

    // END

    recognition.onend =
        function(){

        voiceBtn.innerText =
            "🎤 Speak";
    };
}

// =========================
// SEND ARGUMENT
// =========================

function sendArgument(){

    if(isLoading) return;

    const input =
        document.getElementById(
            "argument"
        );

    const text =
        input.value.trim();

    if(text === "") return;

    // SAVE USER ARG

    lastUserArg = text;

    // SHOW USER

    appendMsg(

        "user",

        `<b>You:</b><br>${text}`
    );

    input.value = "";

    // HUMAN MODE

    if(mode === "human"){

        appendMsg(

            "opponent",

            `<b>Opponent:</b><br>${text}`
        );

        return;
    }

    // LOADING

    isLoading = true;

    document.getElementById(
        "sendBtn"
    ).disabled = true;

    // AI TYPING

    const typingId =
        "typing-" + Date.now();

    appendMsg(

        "ai",

        `<span id="${typingId}">
            <b>AI:</b><br>
            typing...
        </span>`
    );

    // API CALL

    fetch("/api/debate/reply", {

        method:"POST",

        headers:{
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            topic: topic,
            argument: text
        })
    })

    .then(res => res.text())

    .then(data => {

        // CLEAN TEXT

        data = data
            .replace(/\n/g, "<br>")
            .trim();

        // REMOVE REPETITION

        if(
            data.toLowerCase()
                .includes(
                    "i strongly disagree"
                )
        ){

            data = data.replace(

                /i strongly disagree/gi,

                "That argument fails because"
            );
        }

        // SAVE AI ARG

        lastAiArg = data;

        // SHOW AI

        document.getElementById(
            typingId
        ).innerHTML =

            `<b>AI:</b><br>${data}`;

        // AI SPEAKS

        speakText(
            data.replace(/<br>/g, " ")
        );
    })

    .catch(() => {

        document.getElementById(
            typingId
        ).innerHTML =

            "Error: AI not responding";
    })

    .finally(() => {

        isLoading = false;

        document.getElementById(
            "sendBtn"
        ).disabled = false;
    });
}

// =========================
// END DEBATE
// =========================

function endDebate(){

    if(!lastUserArg || !lastAiArg){

        alert(
            "Complete at least one round!"
        );

        return;
    }

    // LOADING RESULT

    document.getElementById(
        "resultBox"
    ).innerHTML = `

        <div class="result-card">

            <h2>
                🏆 Debate Result
            </h2>

            <p>
                Analyzing debate...
            </p>

        </div>
    `;

    // API CALL

    fetch("/api/debate/analyze", {

        method:"POST",

        headers:{
            "Content-Type":
                "application/json"
        },

        body: JSON.stringify({

            topic: topic,
            userArg: lastUserArg,
            aiArg: lastAiArg,
            username: username
        })
    })

    .then(res => res.json())

    .then(data => {

        // FORMAT RESULT

        let formattedResult =

            data.result

            .replace(/\n/g, "<br>")

            .replace(
                /Winner:/g,

                "<br><br><b>🏆 Winner:</b>"
            )

            .replace(
                /Reason:/g,

                "<br><br><b>💬 Reason:</b>"
            )

            .replace(
                /Score:/g,

                "<br><br><b>📊 Score:</b>"
            );

        // SHOW RESULT

        document.getElementById(
            "resultBox"
        ).innerHTML = `

            <div class="result-card">

                <h2>
                    🏆 Debate Result
                </h2>

                <div class="judge-result">

                    ${formattedResult}

                </div>

            </div>
        `;
    })

    .catch(() => {

        document.getElementById(
            "resultBox"
        ).innerHTML = `

            <div class="result-card">

                <h2>
                    ❌ Error
                </h2>

                <p>
                    Error analyzing debate.
                </p>

            </div>
        `;
    });
}

</script>

</body>
</html>
