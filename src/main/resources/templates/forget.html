<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Forgot Password</title>

<link rel="stylesheet"
href="/css/forget.css">

</head>

<body>

<div class="box">
<div class="login">
<div class="loginBx">

<h2>FORGOT PASSWORD</h2>

<input type="text"
id="username"
placeholder="Enter Username">

<input type="button"
value="Search"
onclick="searchUser()">

<input type="text"
id="question"
readonly
style="display:none;">

<input type="text"
id="answer"
placeholder="Answer"
style="display:none;">

<input type="button"
id="verifyBtn"
value="Verify"
onclick="verifyAnswer()"
style="display:none;">

<form id="resetForm"
style="display:none;">

<input type="hidden"
id="hiddenUsername">

<input type="password"
id="newPassword"
placeholder="New Password"
required>

<br><br>

<input type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<input type="submit"
value="Reset Password">

</form>

<div class="group">

<a href="/login">
Back to Login
</a>

</div>

</div>
</div>
</div>

<script src="/js/forget.js"></script>

</body>
</html>
