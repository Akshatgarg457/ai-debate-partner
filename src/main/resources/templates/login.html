<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="box">

    <div class="login">

        <div class="loginBx">

            <h2>
                <i class="fa-solid fa-right-to-bracket"></i>
                LOGIN
            </h2>

            <!-- ERROR / SUCCESS -->
            <p style="color:red; text-align:center;">

                <script>

                if(window.location.search.includes("error=true")){
                    document.write("Invalid username or password");
                }

                if(window.location.search.includes("success=true")){
                    document.write("Signup successful! Please login.");
                }

                if(window.location.search.includes("reset=true")){
                    document.write("Password reset successful!");
                }

                </script>

            </p>

            <!-- LOGIN FORM -->
            <form id="loginForm" action="/login" method="post">

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="submit"
                    value="Sign In"
                >

            </form>

            <!-- LINKS -->
            <div class="group">

                <a href="/forget">
                    Forgot Password
                </a>

                <a href="/signup">
                    Sign up
                </a>

            </div>

        </div>

    </div>

</div>

<!-- SEPARATE JS -->
<script src="/js/login.js"></script>

</body>
</html>
