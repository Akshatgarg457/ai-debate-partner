<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="box">

    <div class="login">

        <div class="loginBx">

            <h2>
                <i class="fa-solid fa-right-to-bracket"></i>
                LOGIN
            </h2>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="submit"
                    value="Sign In"
                >

            </form>

            <div class="group">

                <a href="/forget">
                    Forgot Password
                </a>

                <a href="/signup">
                    Sign up
                </a>

            </div>

        </div>

    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
